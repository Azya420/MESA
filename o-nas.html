<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AXI — O nas</title>
  <meta name="description" content="O nas, technologia i materiały — AXI (wydruki 3D do gier fabularnych)." />
  <link rel="icon" href="assets/axi-favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-about">
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brandlink" href="index.html">
      <div class="brand">
        <img class="logo-img" src="assets/axi-logo.svg" alt="AXI logo" />
        <div class="tag">Wydruki 3D × Gry fabularne</div>
      </div>
    </a>
    <nav class="nav">
      <a href="index.html">Strona główna</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="o-nas.html" aria-current="page">O nas</a>
      <a href="kontakt.html">Kontakt</a>
    </nav>
  </div>
</header>

<main class="wrap onas-layout">
  <nav class="subnav" aria-label="Podstrony O nas">
    <button class="subnav-btn active" type="button" data-slide="0">O AXI</button>
    <button class="subnav-btn" type="button" data-slide="1">Technologia i materiały</button>
    <button class="subnav-btn" type="button" data-slide="2">Realizacje</button>
  </nav>
  <div class="onas-slider">
    <div class="slider-frame">
      <img id="onasSlideImg" src="assets/axi_about_01.svg" alt="O AXI" />
    </div>
  </div>
</main>
<script>
  const slides = [
    {
      title: "O AXI",
      img: "assets/axi_about_01.svg"
    },
    {
      title: "Technologia i materiały",
      img: "assets/axi_about_02.svg"
    },
    {
      title: "Realizacje",
      img: "assets/axi_about_03.svg"
    }
  ];

  const slideImg = document.getElementById('onasSlideImg');
  const navButtons = document.querySelectorAll('.subnav-btn');
  let currentSlide = 0;

  function updateSlide(index){
    currentSlide = index;
    const data = slides[currentSlide];
    slideImg.src = data.img;
    slideImg.alt = data.title;
    navButtons.forEach((btn, idx) => {
      btn.classList.toggle('active', idx === currentSlide);
    });
  }

  navButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      updateSlide(Number(btn.dataset.slide));
    });
  });

  updateSlide(0);
</script>

<div class="footer-divider" aria-hidden="true"></div>
<footer class="site-footer">
  <div class="wrap site-footer-inner">
    <div class="footer-brand">
      <span class="footer-title">AXI</span>
      <span class="footer-subtitle">Wydruki 3D dla gier fabularnych</span>
    </div>
    <div class="footer-links">
      <a href="o-nas.html">O nas</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="kontakt.html">Kontakt</a>
    </div>
    <div class="footer-contact">
      <a href="mailto:kontakt@axi3d.pl">kontakt@axi3d.pl</a>
      <a href="tel:+48600112233">+48 600 112 233</a>
    </div>
  </div>
</footer>

</body>
</html>
